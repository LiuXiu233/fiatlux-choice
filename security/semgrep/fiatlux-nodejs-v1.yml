rules:
  - id: fiatlux.node.sql-string-construction
    languages:
      - javascript
      - typescript
    message: >-
      SQL is built with string concatenation or interpolation. Use the database driver's
      parameterized query/tagged-template API and keep untrusted values out of SQL text.
    severity: ERROR
    metadata:
      ruleset: fiatlux-nodejs
      ruleset-version: 1.0.0
      category: security
      confidence: HIGH
      cwe:
        - "CWE-89: Improper Neutralization of Special Elements used in an SQL Command"
      owasp:
        - A03:2021 - Injection
    pattern-either:
      - pattern: $DB.query($LEFT + $RIGHT, ...)
      - pattern: $DB.execute($LEFT + $RIGHT, ...)
      - pattern: |
          $DB.query(`...${$VALUE}...`, ...)
      - pattern: |
          $DB.execute(`...${$VALUE}...`, ...)

  - id: fiatlux.node.dynamic-sql-raw
    languages:
      - javascript
      - typescript
    message: >-
      A non-literal value is passed to sql.raw(). Prefer parameter binding; if an identifier
      must be dynamic, select it from a closed allowlist before constructing SQL.
    severity: ERROR
    metadata:
      ruleset: fiatlux-nodejs
      ruleset-version: 1.0.0
      category: security
      confidence: HIGH
      cwe:
        - "CWE-89: Improper Neutralization of Special Elements used in an SQL Command"
      owasp:
        - A03:2021 - Injection
    patterns:
      - pattern: sql.raw($QUERY)
      - pattern-not: sql.raw("...")
      - pattern-not: sql.raw(`...`)

  - id: fiatlux.node.shell-command-execution
    languages:
      - javascript
      - typescript
    message: >-
      Shell-based command execution was found. Use execFile/spawn with a fixed executable,
      a separately validated argument array, and shell:false.
    severity: ERROR
    metadata:
      ruleset: fiatlux-nodejs
      ruleset-version: 1.0.0
      category: security
      confidence: HIGH
      cwe:
        - "CWE-78: Improper Neutralization of Special Elements used in an OS Command"
      owasp:
        - A03:2021 - Injection
    pattern-either:
      - pattern: exec(...)
      - pattern: execSync(...)
      - pattern: |
          spawn($COMMAND, $ARGS, { ..., shell: true, ... })
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  import * as $CHILD_PROCESS from "node:child_process";
                  ...
              - pattern-inside: |
                  import * as $CHILD_PROCESS from "child_process";
                  ...
              - pattern-inside: |
                  import $CHILD_PROCESS from "node:child_process";
                  ...
              - pattern-inside: |
                  import $CHILD_PROCESS from "child_process";
                  ...
              - pattern-inside: |
                  const $CHILD_PROCESS = require("node:child_process");
                  ...
              - pattern-inside: |
                  const $CHILD_PROCESS = require("child_process");
                  ...
          - pattern-either:
              - pattern: $CHILD_PROCESS.exec(...)
              - pattern: $CHILD_PROCESS.execSync(...)
              - pattern: |
                  $CHILD_PROCESS.spawn($COMMAND, $ARGS, { ..., shell: true, ... })

  - id: fiatlux.node.dynamic-code-execution
    languages:
      - javascript
      - typescript
    message: >-
      Dynamic code execution bypasses normal code review and can turn data into executable
      code. Replace it with an explicit parser or closed dispatch table.
    severity: ERROR
    metadata:
      ruleset: fiatlux-nodejs
      ruleset-version: 1.0.0
      category: security
      confidence: HIGH
      cwe:
        - "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code"
      owasp:
        - A03:2021 - Injection
    pattern-either:
      - pattern: eval(...)
      - pattern: global.eval(...)
      - pattern: new Function(...)
      - pattern: Function(...)
      - pattern: setTimeout("...", ...)
      - pattern: setInterval("...", ...)

  - id: fiatlux.node.user-controlled-ssrf
    mode: taint
    languages:
      - javascript
      - typescript
    message: >-
      Request-controlled data reaches an outbound HTTP client. Resolve against an HTTPS
      allowlist and block loopback, link-local, private, metadata, redirect, and DNS-rebinding
      destinations before making the request.
    severity: ERROR
    metadata:
      ruleset: fiatlux-nodejs
      ruleset-version: 1.0.0
      category: security
      confidence: HIGH
      cwe:
        - "CWE-918: Server-Side Request Forgery (SSRF)"
      owasp:
        - A10:2021 - Server-Side Request Forgery (SSRF)
    pattern-sources:
      - pattern-either:
          - pattern: $REQUEST.query
          - pattern: $REQUEST.params
          - pattern: $REQUEST.body
          - pattern: $REQUEST.query.$FIELD
          - pattern: $REQUEST.params.$FIELD
          - pattern: $REQUEST.body.$FIELD
          - pattern: $REQUEST.headers[$HEADER]
    pattern-sinks:
      - pattern: fetch($URL, ...)
      - patterns:
          - pattern: $CLIENT.$METHOD($URL, ...)
          - metavariable-regex:
              metavariable: $CLIENT
              regex: ^(?:axios|got|http|https)$
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(?:get|post|put|patch|delete|request)$
      - patterns:
          - pattern: |
              $CLIENT.request({ ..., url: $URL, ... })
          - metavariable-regex:
              metavariable: $CLIENT
              regex: ^(?:axios|got)$

  - id: fiatlux.node.tls-verification-disabled
    languages:
      - javascript
      - typescript
    message: >-
      TLS certificate verification is disabled. Keep certificate and hostname verification
      enabled; install the approved internal CA instead of bypassing trust checks.
    severity: ERROR
    metadata:
      ruleset: fiatlux-nodejs
      ruleset-version: 1.0.0
      category: security
      confidence: HIGH
      cwe:
        - "CWE-295: Improper Certificate Validation"
      owasp:
        - A02:2021 - Cryptographic Failures
    pattern-either:
      - pattern: "{ ..., rejectUnauthorized: false, ... }"
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
      - pattern: process.env["NODE_TLS_REJECT_UNAUTHORIZED"] = "0"

  - id: fiatlux.node.weak-cryptographic-primitive
    languages:
      - javascript
      - typescript
    message: >-
      A broken or obsolete cryptographic primitive is used. Use SHA-256 or stronger for
      integrity, Argon2id for passwords, and an authenticated modern cipher for encryption.
    severity: ERROR
    metadata:
      ruleset: fiatlux-nodejs
      ruleset-version: 1.0.0
      category: security
      confidence: HIGH
      cwe:
        - "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
        - "CWE-328: Use of Weak Hash"
      owasp:
        - A02:2021 - Cryptographic Failures
    pattern-either:
      - pattern: createHash("md5")
      - pattern: createHash("sha1")
      - pattern: $CRYPTO.createHash("md5")
      - pattern: $CRYPTO.createHash("sha1")
      - pattern: createCipher("des", ...)
      - pattern: createCipher("rc4", ...)
      - pattern: createCipheriv("des", ...)
      - pattern: createCipheriv("rc4", ...)
      - pattern: $CRYPTO.createCipher("des", ...)
      - pattern: $CRYPTO.createCipher("rc4", ...)
      - pattern: $CRYPTO.createCipheriv("des", ...)
      - pattern: $CRYPTO.createCipheriv("rc4", ...)

  - id: fiatlux.node.hardcoded-secret
    languages:
      - javascript
      - typescript
    message: >-
      A credential-like variable contains a long string literal. Load secrets from the
      approved runtime secret source and rotate any value that may have been real.
    severity: ERROR
    metadata:
      ruleset: fiatlux-nodejs
      ruleset-version: 1.0.0
      category: security
      confidence: MEDIUM
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
      owasp:
        - A07:2021 - Identification and Authentication Failures
    patterns:
      - pattern-either:
          - pattern: const $SECRET = "$VALUE"
          - pattern: let $SECRET = "$VALUE"
          - pattern: var $SECRET = "$VALUE"
          - pattern: $OBJECT.$SECRET = "$VALUE"
          - pattern: |
              ({ ..., $SECRET: "$VALUE", ... })
      - metavariable-regex:
          metavariable: $SECRET
          regex: (?i).*(?:password|passwd|secret|token|api_?key|apiKey|private_?key).*
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^.{16,}$

  - id: fiatlux.node.sensitive-data-logging
    mode: taint
    languages:
      - javascript
      - typescript
    message: >-
      A secret-bearing value reaches a log call. Log only an allowlisted event shape and
      redact credentials, authorization headers, cookies, and personal data first.
    severity: ERROR
    metadata:
      ruleset: fiatlux-nodejs
      ruleset-version: 1.0.0
      category: security
      confidence: HIGH
      cwe:
        - "CWE-532: Insertion of Sensitive Information into Log File"
      owasp:
        - A09:2021 - Security Logging and Monitoring Failures
    pattern-sources:
      - pattern-either:
          - pattern: $VALUE.password
          - pattern: $VALUE.passwd
          - pattern: $VALUE.secret
          - pattern: $VALUE.token
          - pattern: $VALUE.apiKey
          - pattern: $VALUE.authorization
          - pattern: $VALUE.cookie
          - pattern: $VALUE["password"]
          - pattern: $VALUE["secret"]
          - pattern: $VALUE["token"]
          - pattern: $VALUE["authorization"]
          - pattern: $VALUE["cookie"]
    pattern-sinks:
      - patterns:
          - pattern: $LOGGER.$METHOD(...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(?:trace|debug|info|warn|error|fatal|log)$

  - id: fiatlux.node.react-raw-html-injection
    languages:
      - typescript
    message: >-
      React raw HTML rendering was found. Render structured components or sanitize with a
      centrally reviewed HTML policy before the value reaches dangerouslySetInnerHTML.
    severity: ERROR
    metadata:
      ruleset: fiatlux-nodejs
      ruleset-version: 1.0.0
      category: security
      confidence: HIGH
      cwe:
        - "CWE-79: Improper Neutralization of Input During Web Page Generation"
      owasp:
        - A03:2021 - Injection
    pattern-either:
      - pattern: |
          <$TAG ... dangerouslySetInnerHTML={{ __html: $HTML }} ... />
      - pattern: |
          <$TAG ... dangerouslySetInnerHTML={{ __html: $HTML }} ...>...</$TAG>
