name: Release images and SBOM

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Existing Git tag to release, for example v1.0.0-rc.1
        required: true
        type: string

permissions:
  contents: read
  packages: write

# GHCR does not provide an atomic create-if-absent operation for tags. Serializing every release
# run, checking all target tags before any promotion, and restricting package writes to this
# workflow prevents workflow-driven overwrites.
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release identity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_sha: ${{ steps.source.outputs.release_sha }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Resolve and validate version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            push)
              if [[ "$REF_TYPE" != tag ]]; then
                echo "发布 push 必须来自 Git tag。" >&2
                exit 2
              fi
              version=$REF_NAME
              ;;
            workflow_dispatch)
              version=$INPUT_VERSION
              ;;
            *)
              echo "不支持的发布事件：$GITHUB_EVENT_NAME" >&2
              exit 2
              ;;
          esac
          if ((${#version} > 128)) || \
            [[ ! "$version" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "无效版本：$version；必须是 Docker tag 兼容的 vMAJOR.MINOR.PATCH[-PRERELEASE]。" >&2
            exit 2
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - name: Verify tag commit is already in main
        id: source
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != "LiuXiu233/fiatlux-choice" ]]; then
            echo "拒绝从非交付仓库发布：$GITHUB_REPOSITORY" >&2
            exit 2
          fi
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          git fetch --force origin \
            "+refs/tags/$RELEASE_VERSION:refs/tags/$RELEASE_VERSION"
          release_sha=$(git rev-parse "${GITHUB_SHA}^{commit}")
          tag_sha=$(git rev-parse "refs/tags/$RELEASE_VERSION^{commit}")
          if [[ "$tag_sha" != "$release_sha" ]]; then
            printf '版本 tag 指向 %s，但本次发布 SHA 为 %s。\n' "$tag_sha" "$release_sha" >&2
            exit 3
          fi
          if ! git merge-base --is-ancestor "$release_sha" refs/remotes/origin/main; then
            printf '发布 SHA %s 尚未进入 main。\n' "$release_sha" >&2
            exit 3
          fi
          echo "release_sha=$release_sha" >>"$GITHUB_OUTPUT"
      - name: Confirm all human-readable image tags are unused
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          owner=${GITHUB_REPOSITORY_OWNER,,}
          accept='application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json'
          for component in api worker web gateway minio backup; do
            package="fiatlux-choice-$component"
            registry_token=$(curl --fail --silent --show-error \
              --user "$GITHUB_ACTOR:$GHCR_TOKEN" \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:$owner/$package:pull" |
              jq -er '.token')
            http_status=$(curl --silent --show-error --output /dev/null \
              --write-out '%{http_code}' --head \
              --header "Authorization: Bearer $registry_token" \
              --header "Accept: $accept" \
              "https://ghcr.io/v2/$owner/$package/manifests/$RELEASE_VERSION")
            case "$http_status" in
              404) ;;
              200)
                printf '拒绝覆盖已存在的镜像 tag：ghcr.io/%s/%s:%s\n' \
                  "$owner" "$package" "$RELEASE_VERSION" >&2
                exit 4
                ;;
              *)
                printf '无法可靠确认镜像 tag 是否存在（%s，HTTP %s）。\n' \
                  "$package" "$http_status" >&2
                exit 5
                ;;
            esac
          done

  verify:
    name: Verify release source
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    needs:
      - prepare
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: fiatlux_choice
          POSTGRES_USER: fiatlux
          POSTGRES_PASSWORD: fiatlux_release_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fiatlux -d fiatlux_choice"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: "true"
      NODE_ENV: test
      DATABASE_URL: postgresql://fiatlux:fiatlux_release_ci_password@127.0.0.1:5432/fiatlux_choice
      TEST_DATABASE_URL: postgresql://fiatlux:fiatlux_release_ci_password@127.0.0.1:5432/fiatlux_choice
      WEB_ORIGIN: http://127.0.0.1:4173
      SESSION_SECRET: release-ci-session-secret-with-more-than-32-characters
      JWT_SECRET: release-ci-session-secret-with-more-than-32-characters
      COOKIE_SECURE: "false"
      TEST_S3_ENDPOINT: http://127.0.0.1:9000
      TEST_S3_REGION: cn-south-1
      TEST_S3_BUCKET: fiatlux-choice
      TEST_S3_ACCESS_KEY_ID: fiatlux
      TEST_S3_SECRET_ACCESS_KEY: fiatlux_release_minio_password
      LLM_DRIVER: mock
      GITHUB_INTEGRATION_MODE: manual
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.13.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build the repository MinIO release-test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.minio
          load: true
          tags: fiatlux-release-minio:local
          cache-from: type=gha,scope=release-minio-test
          cache-to: type=gha,mode=max,scope=release-minio-test
      - name: Start MinIO
        run: |
          docker run --detach --name fiatlux-release-minio \
            --pull never \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER="$TEST_S3_ACCESS_KEY_ID" \
            --env MINIO_ROOT_PASSWORD="$TEST_S3_SECRET_ACCESS_KEY" \
            fiatlux-release-minio:local server /data
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs fiatlux-release-minio
          exit 1
      - name: Create private object bucket with the same image's mc
        run: |
          docker run --rm --pull never --network host \
            --entrypoint /bin/sh \
            --env S3_ACCESS_KEY_ID="$TEST_S3_ACCESS_KEY_ID" \
            --env S3_SECRET_ACCESS_KEY="$TEST_S3_SECRET_ACCESS_KEY" \
            --env S3_BUCKET="$TEST_S3_BUCKET" \
            fiatlux-release-minio:local -ec '
              mc alias set release http://127.0.0.1:9000 "$S3_ACCESS_KEY_ID" "$S3_SECRET_ACCESS_KEY" --api S3v4 >/dev/null
              mc mb --ignore-existing "release/$S3_BUCKET"
              mc anonymous set none "release/$S3_BUCKET"
            '
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm db:migrate
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm --filter @fiatlux/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  build-scan:
    name: Build and scan ${{ matrix.image }} by digest
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    needs:
      - prepare
      - verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: Dockerfile.api
          - image: worker
            dockerfile: Dockerfile.worker
          - image: web
            dockerfile: Dockerfile.web
          - image: gateway
            dockerfile: Dockerfile.caddy
          - image: minio
            dockerfile: Dockerfile.minio
          - image: backup
            dockerfile: Dockerfile.backup
    env:
      REGISTRY_IMAGE: ghcr.io/liuxiu233/fiatlux-choice-${{ matrix.image }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Recheck that the target tag is unused
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner=${GITHUB_REPOSITORY_OWNER,,}
          package="fiatlux-choice-${{ matrix.image }}"
          registry_token=$(curl --fail --silent --show-error \
            --user "$GITHUB_ACTOR:$GHCR_TOKEN" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:$owner/$package:pull" |
            jq -er '.token')
          http_status=$(curl --silent --show-error --output /dev/null \
            --write-out '%{http_code}' --head \
            --header "Authorization: Bearer $registry_token" \
            --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/$owner/$package/manifests/$RELEASE_VERSION")
          if [[ "$http_status" == 200 ]]; then
            echo "拒绝覆盖已存在的镜像 tag：$REGISTRY_IMAGE:$RELEASE_VERSION" >&2
            exit 4
          fi
          if [[ "$http_status" != 404 ]]; then
            echo "无法可靠确认目标镜像 tag 是否存在（HTTP $http_status）。" >&2
            exit 5
          fi
      - name: Build and push content-addressed image only
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          cache-from: type=gha,scope=release-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.image }}
      - name: Validate pushed digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Buildx 未返回有效 digest。" >&2
            exit 3
          fi
          docker buildx imagetools inspect "$REGISTRY_IMAGE@$IMAGE_DIGEST" >/dev/null
      - name: Verify multi-platform BuildKit provenance
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          index_json=$(mktemp)
          trap 'rm -f "${index_json:-}" "${attestation_json:-}"' EXIT
          docker buildx imagetools inspect --raw \
            "$REGISTRY_IMAGE@$IMAGE_DIGEST" >"$index_json"

          for architecture in amd64 arm64; do
            platform_count=$(jq --arg architecture "$architecture" \
              '[.manifests[]? | select(.platform.os == "linux" and .platform.architecture == $architecture)] | length' \
              "$index_json")
            if [[ "$platform_count" != 1 ]]; then
              printf '期望恰好一个 linux/%s manifest，实际为 %s。\n' \
                "$architecture" "$platform_count" >&2
              exit 3
            fi
          done
          total_platform_count=$(jq \
            '[.manifests[]? | select((.annotations["vnd.docker.reference.type"] // "") != "attestation-manifest")] | length' \
            "$index_json")
          if [[ "$total_platform_count" != 2 ]]; then
            printf '期望恰好两个可运行平台 manifest，实际为 %s。\n' \
              "$total_platform_count" >&2
            exit 3
          fi

          mapfile -t platform_digests < <(jq -r \
            '.manifests[]? | select(.platform.os == "linux" and (.platform.architecture == "amd64" or .platform.architecture == "arm64")) | .digest' \
            "$index_json")
          for platform_digest in "${platform_digests[@]}"; do
            if [[ ! "$platform_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              printf '无效平台 digest：%s。\n' "$platform_digest" >&2
              exit 3
            fi
            mapfile -t attestation_digests < <(jq -r --arg platform_digest "$platform_digest" \
              '.manifests[]? | select(
                .annotations["vnd.docker.reference.type"] == "attestation-manifest" and
                .annotations["vnd.docker.reference.digest"] == $platform_digest
              ) | .digest' "$index_json")
            if ((${#attestation_digests[@]} < 1)); then
              printf '平台 manifest %s 缺少 BuildKit attestation。\n' \
                "$platform_digest" >&2
              exit 3
            fi
            valid_provenance=0
            for attestation_digest in "${attestation_digests[@]}"; do
              if [[ ! "$attestation_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                printf '无效 attestation digest：%s。\n' \
                  "$attestation_digest" >&2
                exit 3
              fi
              attestation_json=$(mktemp)
              docker buildx imagetools inspect --raw \
                "$REGISTRY_IMAGE@$attestation_digest" >"$attestation_json"
              if jq -e --arg subject "$platform_digest" '
                .mediaType == "application/vnd.oci.image.manifest.v1+json" and
                .subject.digest == $subject and
                any(.layers[]?;
                  .mediaType == "application/vnd.in-toto+json" and
                  ((.annotations["in-toto.io/predicate-type"] // "") |
                    startswith("https://slsa.dev/provenance/"))
                )' "$attestation_json" >/dev/null; then
                valid_provenance=1
              fi
              rm -f "$attestation_json"
            done
            if ((valid_provenance != 1)); then
              printf '平台 manifest %s 缺少 SLSA provenance predicate。\n' \
                "$platform_digest" >&2
              exit 3
            fi
          done
          rm -f "$index_json"
      - name: Scan amd64 digest and preserve all high-severity findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          image-ref: ${{ env.REGISTRY_IMAGE }}@${{ steps.build.outputs.digest }}
          format: json
          output: trivy-amd64.json
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
      - name: Enforce zero fixable amd64 HIGH/CRITICAL findings
        run: |
          set -euo pipefail
          total=$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy-amd64.json)
          fixable=$(jq '[.Results[]?.Vulnerabilities[]? | select((.FixedVersion // "") != "")] | length' trivy-amd64.json)
          printf 'amd64 HIGH/CRITICAL：总计=%s，可修复=%s\n' "$total" "$fixable"
          if ((fixable > 0)); then
            echo "发现可修复的 amd64 HIGH/CRITICAL 漏洞，拒绝发布。" >&2
            exit 1
          fi
      - name: Scan arm64 digest and preserve all high-severity findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ env.REGISTRY_IMAGE }}@${{ steps.build.outputs.digest }}
          format: json
          output: trivy-arm64.json
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
      - name: Enforce zero fixable arm64 HIGH/CRITICAL findings
        run: |
          set -euo pipefail
          total=$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy-arm64.json)
          fixable=$(jq '[.Results[]?.Vulnerabilities[]? | select((.FixedVersion // "") != "")] | length' trivy-arm64.json)
          printf 'arm64 HIGH/CRITICAL：总计=%s，可修复=%s\n' "$total" "$fixable"
          if ((fixable > 0)); then
            echo "发现可修复的 arm64 HIGH/CRITICAL 漏洞，拒绝发布。" >&2
            exit 1
          fi
      - name: Upload complete Trivy reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-${{ matrix.image }}-${{ needs.prepare.outputs.version }}
          path: |
            trivy-amd64.json
            trivy-arm64.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true
      - name: Generate SPDX SBOM for the verified digest
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.REGISTRY_IMAGE }}@${{ steps.build.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: sbom-${{ matrix.image }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Upload SPDX SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.image }}-${{ needs.prepare.outputs.version }}
          path: sbom-${{ matrix.image }}.spdx.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true
      - name: Record verified digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p release-digests
          printf '%s\n' "$IMAGE_DIGEST" >"release-digests/${{ matrix.image }}.txt"
      - name: Upload verified digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-digest-${{ matrix.image }}
          path: release-digests/${{ matrix.image }}.txt
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  promote:
    name: Promote verified digests to ${{ needs.prepare.outputs.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs:
      - prepare
      - verify
      - build-scan
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Download all verified digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-digest-*
          path: release-digests
          merge-multiple: true
          digest-mismatch: error
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Preflight every digest and target tag
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner=${GITHUB_REPOSITORY_OWNER,,}
          accept='application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json'
          mkdir -p release-output
          printf 'version\tcomponent\tdigest\n' >release-output/release-manifest.tsv
          for component in api worker web gateway minio backup; do
            digest_file="release-digests/$component.txt"
            if [[ ! -f "$digest_file" ]]; then
              echo "缺少已验证 digest：$component" >&2
              exit 3
            fi
            digest=$(<"$digest_file")
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "无效 digest：$component" >&2
              exit 3
            fi
            image="ghcr.io/$owner/fiatlux-choice-$component"
            docker buildx imagetools inspect "$image@$digest" >/dev/null
            registry_token=$(curl --fail --silent --show-error \
              --user "$GITHUB_ACTOR:$GHCR_TOKEN" \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:$owner/fiatlux-choice-$component:pull" |
              jq -er '.token')
            http_status=$(curl --silent --show-error --output /dev/null \
              --write-out '%{http_code}' --head \
              --header "Authorization: Bearer $registry_token" \
              --header "Accept: $accept" \
              "https://ghcr.io/v2/$owner/fiatlux-choice-$component/manifests/$RELEASE_VERSION")
            if [[ "$http_status" == 200 ]]; then
              echo "拒绝覆盖已存在的镜像 tag：$image:$RELEASE_VERSION" >&2
              exit 4
            fi
            if [[ "$http_status" != 404 ]]; then
              echo "无法可靠确认目标镜像 tag 是否存在（$component，HTTP $http_status）。" >&2
              exit 5
            fi
            printf '%s\t%s\t%s\n' "$RELEASE_VERSION" "$component" "$digest" \
              >>release-output/release-manifest.tsv
          done
      - name: Create human-readable tags only after every scan passed
        run: |
          set -euo pipefail
          owner=${GITHUB_REPOSITORY_OWNER,,}
          for component in api worker web gateway minio backup; do
            digest=$(<"release-digests/$component.txt")
            image="ghcr.io/$owner/fiatlux-choice-$component"
            docker buildx imagetools create \
              --tag "$image:$RELEASE_VERSION" \
              "$image@$digest"
            resolved=$(docker buildx imagetools inspect \
              --format '{{.Manifest.Digest}}' "$image:$RELEASE_VERSION")
            if [[ "$resolved" != "$digest" ]]; then
              printf '镜像 tag 校验失败：%s 期望 %s，实际 %s。\n' \
                "$component" "$digest" "$resolved" >&2
              exit 6
            fi
          done
          {
            echo '### 已发布镜像 digest'
            echo
            echo '```text'
            column -t -s $'\t' release-output/release-manifest.tsv
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Upload release manifest
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-manifest-${{ needs.prepare.outputs.version }}
          path: release-output/release-manifest.tsv
          if-no-files-found: warn
          retention-days: 90
          overwrite: true
