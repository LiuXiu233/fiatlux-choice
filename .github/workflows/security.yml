name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 18 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TRIVY_VERSION: v0.70.0

jobs:
  code-security-capability:
    name: Detect code scanning entitlement
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: read
    outputs:
      available: ${{ steps.probe.outputs.available }}
    steps:
      - name: Probe the repository code scanning API
        id: probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          response_file="$RUNNER_TEMP/code-scanning-capability.json"
          http_status=$(curl --silent --show-error --output "$response_file" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/code-scanning/alerts?per_page=1")
          case "$http_status" in
            200)
              echo "available=true" >>"$GITHUB_OUTPUT"
              echo "Code scanning API is available for this run." >>"$GITHUB_STEP_SUMMARY"
              ;;
            403 | 404)
              echo "available=false" >>"$GITHUB_OUTPUT"
              {
                echo "Code scanning API is not available for this run (HTTP $http_status)."
                echo "CodeQL and SARIF code-scanning upload will be explicitly skipped; ordinary SARIF artifacts remain available."
              } >>"$GITHUB_STEP_SUMMARY"
              echo "::notice::Code scanning entitlement is unavailable (HTTP $http_status); CodeQL is explicitly skipped."
              ;;
            *)
              echo "Unable to determine code scanning capability (HTTP $http_status)." >&2
              exit 2
              ;;
          esac

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Run reproducible redacted Gitleaks current-tree and history gate
        run: ./scripts/test-secret-scan.sh
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.13.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies against the official registry
        run: pnpm audit --prod --audit-level high --registry=https://registry.npmjs.org

  semgrep:
    name: Semgrep SAST (OSS)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SEMGREP_IMAGE: semgrep/semgrep:1.170.0@sha256:c98f8829eea377274ee4b10656458b078b88232469b2ff913f091c2317347c9d
      SEMGREP_VERSION: 1.170.0
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Verify the pinned Semgrep runtime
        run: |
          set -euo pipefail
          actual=$(docker run --rm "$SEMGREP_IMAGE" semgrep --version | head -n 1)
          test "$actual" = "$SEMGREP_VERSION"
          {
            echo '### Semgrep SAST (OSS)'
            echo
            echo "Runtime: Semgrep OSS $actual ($SEMGREP_IMAGE)"
            echo 'This independent gate does not mean CodeQL ran or passed and is not an approved equivalent until the security owner signs off.'
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Validate the local Semgrep rules
        run: |
          docker run --rm \
            --volume "$PWD:/src" \
            --workdir /src \
            "$SEMGREP_IMAGE" \
            semgrep scan --validate --metrics=off --disable-version-check \
              --strict \
              --config security/semgrep/fiatlux-nodejs-v1.yml
      - name: Verify the intentionally vulnerable canary
        run: |
          docker run --rm \
            --volume "$PWD:/src" \
            --workdir /src \
            "$SEMGREP_IMAGE" \
            sh security/semgrep/verify-canary.sh
      - name: Scan production TypeScript and Node.js code
        run: |
          mkdir -p semgrep-results
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$PWD:/src" \
            --workdir /src \
            "$SEMGREP_IMAGE" \
            semgrep scan \
              --config security/semgrep/fiatlux-nodejs-v1.yml \
              --metrics=off \
              --disable-version-check \
              --strict \
              --error \
              --exclude 'security/semgrep/canary/**' \
              --exclude 'apps/api/src/index.ts' \
              --exclude '**/dist/**' \
              --exclude '**/coverage/**' \
              --exclude '**/node_modules/**' \
              --exclude '**/test/**' \
              --exclude '**/tests/**' \
              --exclude '**/*.test.*' \
              --exclude '**/*.spec.*' \
              --exclude 'apps/web/e2e/**' \
              --json-output semgrep-results/semgrep-results.json \
              --sarif-output semgrep-results/semgrep-results.sarif \
              .
      - name: Upload Semgrep JSON and SARIF as ordinary workflow artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-sast-${{ github.run_id }}
          path: semgrep-results
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  filesystem:
    name: Filesystem vulnerabilities
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    needs:
      - code-security-capability
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Generate filesystem SARIF and enforce the vulnerability gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_INCLUDE_DEV_DEPS: "true"
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "1"
          version: ${{ env.TRIVY_VERSION }}
      - name: Upload filesystem SARIF as an ordinary workflow artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-filesystem-sarif-${{ github.run_id }}
          path: trivy-results.sarif
          if-no-files-found: error
          retention-days: 30
          overwrite: true
      - name: Upload filesystem SARIF to code scanning
        if: ${{ always() && needs.code-security-capability.outputs.available == 'true' && hashFiles('trivy-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          sarif_file: trivy-results.sarif

  codeql:
    name: CodeQL (entitlement-aware)
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    needs:
      - code-security-capability
    steps:
      - name: Record explicit CodeQL skip
        if: needs.code-security-capability.outputs.available != 'true'
        run: |
          {
            echo '### CodeQL 未运行'
            echo
            echo '当前仓库或当前令牌没有可确认的 GitHub Code Scanning 能力。此状态是明确跳过，不代表 CodeQL 通过。'
          } >>"$GITHUB_STEP_SUMMARY"
          echo "::notice::CodeQL skipped because code scanning capability was not confirmed."
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: needs.code-security-capability.outputs.available == 'true'
      - name: Initialize CodeQL
        if: needs.code-security-capability.outputs.available == 'true'
        uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          languages: javascript-typescript
          build-mode: none
          config-file: ./.github/codeql-config.yml
      - name: Analyze and upload CodeQL results
        id: codeql-analyze
        if: needs.code-security-capability.outputs.available == 'true'
        uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          output: codeql-results
          upload: always
      - name: Upload CodeQL SARIF as an ordinary workflow artifact
        if: ${{ always() && needs.code-security-capability.outputs.available == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-sarif-${{ github.run_id }}
          path: codeql-results
          if-no-files-found: warn
          retention-days: 30
          overwrite: true
