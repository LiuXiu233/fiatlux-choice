services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set for production}
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          memory: 256M

  minio:
    pull_policy: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set for production}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set for production}
      MC_HOST_local: http://${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}:${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}@127.0.0.1:9000
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          memory: 256M

  minio-bootstrap:
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set for production}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set for production}

  migrate:
    pull_policy: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fiatlux}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-fiatlux_choice}

  api:
    pull_policy: always
    environment:
      APP_ORIGIN: https://${APP_DOMAIN:?APP_DOMAIN must be set}:${HTTPS_PORT:-8443}
      PUBLIC_APP_URL: https://${APP_DOMAIN:?APP_DOMAIN must be set}:${HTTPS_PORT:-8443}
      WEB_ORIGIN: https://${APP_DOMAIN:?APP_DOMAIN must be set}:${HTTPS_PORT:-8443}
      DATABASE_URL: postgresql://${POSTGRES_USER:-fiatlux}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-fiatlux_choice}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set for production}
      JWT_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set for production}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-43200}
      COOKIE_SECURE: "true"
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?INITIAL_ADMIN_PASSWORD must be set for production}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set for production}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set for production}
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          memory: 256M

  worker:
    pull_policy: always
    environment:
      APP_ORIGIN: https://${APP_DOMAIN:?APP_DOMAIN must be set}:${HTTPS_PORT:-8443}
      PUBLIC_APP_URL: https://${APP_DOMAIN:?APP_DOMAIN must be set}:${HTTPS_PORT:-8443}
      WEB_ORIGIN: https://${APP_DOMAIN:?APP_DOMAIN must be set}:${HTTPS_PORT:-8443}
      DATABASE_URL: postgresql://${POSTGRES_USER:-fiatlux}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-fiatlux_choice}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set for production}
      JWT_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set for production}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-43200}
      COOKIE_SECURE: "true"
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?INITIAL_ADMIN_PASSWORD must be set for production}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set for production}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set for production}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set for production}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:?BACKUP_AGE_RECIPIENT must be set for production}
      BACKUP_REQUIRE_ENCRYPTION: "true"
    volumes:
      - ${BACKUP_DIR:?BACKUP_DIR must be set for production}:/backups
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          memory: 256M

  web:
    pull_policy: always
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          memory: 64M

  caddy:
    pull_policy: always
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile.prod", "--adapter", "caddyfile"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN must be set for production}
    extra_hosts:
      - "${APP_DOMAIN:?APP_DOMAIN must be set for production}:127.0.0.1"
    ports:
      - ${BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-8443}:8443
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q -O /dev/null https://$${APP_DOMAIN}:8443/health/live"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          memory: 64M

  backup-tools:
    pull_policy: always
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set for production}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set for production}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set for production}
      BACKUP_REQUIRE_ENCRYPTION: "true"
    volumes:
      - ${BACKUP_DIR:?BACKUP_DIR must be set for production}:/backups
